# Intégration continue (CI) et déploiement continu (CD).
#
# À chaque push et à chaque pull request : tests et build du site, tests et
# vérification des types du serveur. Rien n'est mis en ligne si un seul test
# échoue.
#
# Sur la branche main, si les secrets Cloudflare sont configurés dans GitHub
# (Settings → Secrets and variables → Actions), le serveur et le site sont
# ensuite mis en ligne automatiquement.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un nouveau push annule l'exécution précédente encore en cours sur la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Site Angular
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/spade-cup/browser

  api:
    name: Serveur Cloudflare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # npm 11 : npm 10.9 plante sur les dépendances de Vitest 4 (voir le README).
      - run: npx -y npm@11 ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: Mise en ligne
    needs: [site, api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Secrets Cloudflare présents ?
        id: check
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Secrets Cloudflare absents : tests OK, mais rien n'est mis en ligne."
          fi
      - uses: actions/checkout@v5
        if: steps.check.outputs.ok
      - uses: actions/setup-node@v5
        if: steps.check.outputs.ok
        with:
          node-version: 22
      - name: Serveur — dépendances
        if: steps.check.outputs.ok
        working-directory: api
        run: npx -y npm@11 ci
      # Les migrations d'abord : le nouveau code peut avoir besoin d'une nouvelle colonne.
      - name: Serveur — migrations de la base
        if: steps.check.outputs.ok
        working-directory: api
        run: npx wrangler d1 migrations apply spade-cup-db --remote
      - name: Serveur — mise en ligne
        if: steps.check.outputs.ok
        working-directory: api
        run: npx wrangler deploy
      - uses: actions/download-artifact@v4
        if: steps.check.outputs.ok
        with:
          name: site
          path: dist/spade-cup/browser
      - name: Site — mise en ligne
        if: steps.check.outputs.ok
        working-directory: api
        run: npx wrangler deploy -c ../wrangler.jsonc
