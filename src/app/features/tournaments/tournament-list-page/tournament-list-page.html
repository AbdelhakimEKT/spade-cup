<h1>Tournois</h1>

@if (tournaments.hasValue()) {
  <ul class="list">
    @for (t of tournaments.value(); track t.slug) {
      <li>
        <a class="item" [routerLink]="['/tournois', t.slug]">
          <span class="item__name">{{ t.name }}</span>
          <span class="item__meta">{{ t.clanCount }} clans</span>
          @if (t.isDemo) {
            <span class="chip chip--muted">Démo</span>
          }
          <span class="chip" [class.chip--muted]="t.status === 'finished'">{{
            statusLabel[t.status]
          }}</span>
        </a>
      </li>
    } @empty {
      <li class="empty">Aucun tournoi pour le moment.</li>
    }
  </ul>
} @else {
  <sc-request-state [resource]="tournaments" />
}
