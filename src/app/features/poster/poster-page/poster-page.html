<!-- data-ready : le bot attend cet attribut (logos chargés) avant de photographier. -->
<article class="poster" [attr.data-ready]="ready() ? '' : null" aria-label="Affiche du match">
  <!-- Trait oblique qui sépare les deux camps -->
  <div class="poster__divider" aria-hidden="true"></div>

  <header class="poster__head">
    <img class="poster__brand" src="brand/friendly-wars-160.webp" width="120" height="120" alt="" />
    <p class="poster__name">Friendly Wars</p>
    <p class="poster__kind"><span>Guerre amicale</span></p>
  </header>

  <section class="duel">
    <ng-container
      *ngTemplateOutlet="team; context: { $implicit: left(), side: 'left', failed: leftFailed() }"
    />
    <div class="duel__vs" aria-label="contre">VS</div>
    <ng-container
      *ngTemplateOutlet="
        team;
        context: { $implicit: right(), side: 'right', failed: rightFailed() }
      "
    />
  </section>

  <dl class="facts">
    <div class="fact">
      <dt>Format</dt>
      <dd>{{ format() }}</dd>
    </div>
    <div class="fact">
      <dt>Date</dt>
      <dd>{{ date() }}</dd>
    </div>
    <div class="fact">
      <dt>Heure</dt>
      <dd>{{ time() }}</dd>
      <p class="fact__note">Heure de France ({{ offset() }})</p>
    </div>
    <div class="fact fact--rules">
      <dt>Règles</dt>
      <dd>{{ rules() }}</dd>
    </div>
  </dl>

  <footer class="poster__foot">
    <span>Friendly Wars</span>
    @if (discord) {
      <span class="poster__discord">
        <span class="poster__discord-label">Discord</span>
        {{ discord }}
      </span>
    }
  </footer>
</article>

<ng-template #team let-t let-side="side" let-failed="failed">
  <figure class="team" [class]="'team team--' + side">
    <div class="team__logo-box">
      @if (t.logo && !failed) {
        <img
          class="team__logo"
          [src]="t.logo"
          alt=""
          (load)="logoLoaded(side)"
          (error)="logoFailed(side)"
        />
      } @else {
        <span class="team__initials">{{ t.initials }}</span>
      }
    </div>
    <figcaption class="team__name">{{ t.name }}</figcaption>
    <span class="team__bar" aria-hidden="true"></span>
  </figure>
</ng-template>
